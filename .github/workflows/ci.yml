name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Check go.mod is tidy
        run: go mod tidy && git diff --exit-code go.mod go.sum
      - name: Test
        run: go test -race -count=1 -cover ./...
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.13.2
      - name: Cross-platform build checks
        run: |
          GOOS=windows go vet ./...
          GOOS=darwin go build ./...
      - name: Version injection check
        run: |
          go build -ldflags "-X github.com/mik3dev/kie-cli/internal/cli.Version=ci-check" -o "$RUNNER_TEMP/kie-cli" ./cmd/kie-cli
          "$RUNNER_TEMP/kie-cli" version | grep -q '"version":"ci-check"'
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: check
