name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Check go.mod is tidy
        run: go mod tidy && git diff --exit-code go.mod go.sum
      - name: Vulnerability check
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      - name: Test
        run: go test -race -count=1 -cover ./...
      - uses: golangci/golangci-lint-action@v9
        with:
          # v2.13.2 cannot read go1.27.2 export data (typecheck errors); v2.15.0 can.
          version: v2.15.0
          # Build golangci-lint with the job's Go so a newer Go patch release does not break the prebuilt binary.
          install-mode: goinstall
      - name: Cross-platform build checks
        run: |
          GOOS=windows go vet ./...
          GOOS=darwin go build ./...
      - name: Version injection check
        run: |
          go build -ldflags "-X github.com/mik3dev/kie-cli/internal/cli.Version=ci-check" -o "$RUNNER_TEMP/kie-cli" ./cmd/kie-cli
          "$RUNNER_TEMP/kie-cli" version | grep -q '"version":"ci-check"'
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: check
